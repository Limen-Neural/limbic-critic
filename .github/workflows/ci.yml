name: CI

on:
  push:
    branches: [main]
  # Any PR (including the stacked crates.io readiness branches) so
  # feature-to-feature PRs still run fmt/clippy/test/package.
  pull_request:

jobs:
  validate:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    permissions:
      contents: read
    steps:
      # Pinned to full commit SHA for supply-chain security.
      # Upgraded from v4 SHA (34e11...) to v7 SHA (9c09...) for consistency with coverage.yml
      # (see coverage workflow). This is a security-pinned immutable SHA corresponding to
      # actions/checkout@v7. No submodules, LFS, or custom fetch-depth used in this workflow,
      # so no breaking changes from v5/v6/v7 affect it. Verified against GitHub's official
      # actions/checkout releases.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      # Pinned to full commit SHA for dtolnay/rust-toolchain (corresponds to v1 tag, aligned with coverage.yml for consistency)
      # This ensures immutable build behavior and satisfies security scanners.
      # Dev toolchain: keep rust-toolchain.toml channel and the toolchain:
      # strings in ci.yml and coverage.yml identical (GH-41). This is separate
      # from the MSRV (Cargo.toml rust-version), which the `msrv` job tests.
      - name: Install Rust 1.99.0
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: "1.99.0"
          components: clippy, rustfmt

      # shell: bash so the awk script runs on Windows runners too.
      - name: Verify toolchain pins and MSRV docs
        shell: bash
        run: |
          set -euo pipefail
          strip_cr() { tr -d '\r'; }
          extract_toolchain() {
            local file="$1"
            awk '
              BEGIN { want = 0; in_rt = 0; lines = 0 }
              { sub(/\r$/, "") }
              /^[[:space:]]*- name:[[:space:]]*Install Rust/ { want = 1; next }
              want && /uses: dtolnay\/rust-toolchain@/ { in_rt = 1; next }
              in_rt && /^[[:space:]]*toolchain:[[:space:]]*/ {
                sub(/^[[:space:]]*toolchain:[[:space:]]*/, "")
                sub(/[[:space:]]*$/, "")
                print
                exit 0
              }
              want {
                lines++
                if (lines > 20) exit 1
                if (/^[[:space:]]*- name:/) exit 1
              }
            ' "$file"
          }
          toolchain_ch=$(grep -m1 '^channel' rust-toolchain.toml | sed -E 's/.*"([^"]+)".*/\1/' | strip_cr)
          # every fixed dev pin in ci.yml, any quoting, including the package job;
          # the msrv job's expression-based toolchain (${{ ... }}) is excluded
          ci_rv=$(grep -E '^[[:space:]]*toolchain:' .github/workflows/ci.yml | grep -v '\${{' | sed -E "s/^[[:space:]]*toolchain:[[:space:]]*//; s/[[:space:]]+#.*$//; s/[[:space:]]*$//; s/[\"']//g" | strip_cr | sort -u | paste -sd, - || true)
          cov_rv=$(extract_toolchain .github/workflows/coverage.yml | tr -d '"' | strip_cr)
          if [ -z "${ci_rv:-}" ] || [ -z "${cov_rv:-}" ]; then
            echo "ERROR: Failed to extract toolchain: from CI or coverage workflow" >&2
            exit 1
          fi
          echo "rust-toolchain.toml channel=$toolchain_ch"
          echo "ci.yml pin=$ci_rv"
          echo "coverage.yml pin=$cov_rv"
          if [ "$toolchain_ch" != "$ci_rv" ] || [ "$toolchain_ch" != "$cov_rv" ]; then
            echo "ERROR: dev toolchain pins disagree (rust-toolchain.toml, ci.yml, coverage.yml)." >&2
            exit 1
          fi
          # MSRV stated in the docs must match Cargo.toml rust-version
          cargo_rv=$(grep -m1 '^rust-version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/' | strip_cr)
          echo "Cargo.toml rust-version=$cargo_rv"
          for doc in README.md CONTRIBUTING.md; do
            doc_rv=$(grep -m1 -oE '\*\*MSRV:\*\* Rust [0-9]+(\.[0-9]+)*' "$doc" | sed -E 's/.*Rust //' | strip_cr || true)
            echo "$doc MSRV=${doc_rv:-<missing>}"
            if [ "${doc_rv:-}" != "$cargo_rv" ]; then
              echo "ERROR: $doc MSRV does not match Cargo.toml rust-version ($cargo_rv)." >&2
              exit 1
            fi
          done

      # Swatinem/rust-cache is used instead of raw actions/cache + static key.
      # It handles Rust-specific caching (including git deps like neuromod) and
      # avoids the Cargo.lock gitignore problem that caused stale caches.
      - name: Cache cargo registry
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae

      # rustfmt is OS-agnostic; keep it Linux-only like neuromod / axon-encoder.
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --check

      - name: Clippy (lint)
        shell: bash
        run: cargo clippy --all-targets --all-features -- -D warnings

      # rustdoc output does not vary by OS; keep it Linux-only.
      - name: Build documentation
        if: runner.os == 'Linux'
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

      - name: Build
        run: cargo build --all-features

      - name: Test
        run: cargo test --all-features

  msrv:
    name: MSRV build & test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Read MSRV from Cargo.toml
        id: msrv
        run: |
          rv=$(grep -m1 '^rust-version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/' | tr -d '\r')
          if [ -z "${rv:-}" ]; then
            echo "ERROR: Could not read rust-version from Cargo.toml" >&2
            exit 1
          fi
          if ! [[ "$rv" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
            echo "ERROR: rust-version '$rv' is not a plain X.Y[.Z] version" >&2
            exit 1
          fi
          echo "version=$rv" >> "$GITHUB_OUTPUT"

      - name: Install Rust ${{ steps.msrv.outputs.version }}
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      # Explicit +toolchain so rust-toolchain.toml (dev pin) does not override.
      - name: Build
        env:
          MSRV: ${{ steps.msrv.outputs.version }}
        run: cargo "+$MSRV" build --all-targets --all-features

      - name: Test
        env:
          MSRV: ${{ steps.msrv.outputs.version }}
        run: cargo "+$MSRV" test --all-targets --all-features

  package:
    name: cargo package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      # Keep in lockstep with rust-toolchain.toml / coverage.yml (GH-41).
      - name: Install Rust 1.99.0
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: "1.99.0"

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae

      - name: cargo package --list
        run: cargo package --list --allow-dirty

      - name: cargo package
        run: cargo package --allow-dirty

      # Closed-by-default (GH#72): exact-inventory diff. Any unknown future
      # local/agent/tool directory fails the build by construction, unlike
      # the old required/forbidden denylist which passed despite leaks.
      - name: Assert package contents
        run: |
          set -euo pipefail
          list="$(cargo package --list --allow-dirty)"
          expected=(
            .cargo_vcs_info.json
            CHANGELOG.md
            Cargo.lock
            Cargo.toml
            Cargo.toml.orig
            LICENSE-APACHE-2.0
            LICENSE-MIT
            LICENSES/Apache-2.0.txt
            LICENSES/MIT.txt
            README.md
            REUSE.toml
            docs/ARCHITECTURE.md
            docs/BOUNDARY_MATRIX.md
            examples/generic_environment.rs
            src/critic.rs
            src/environment.rs
            src/error.rs
            src/lib.rs
            src/modulators.rs
          )
          if ! diff <(printf '%s\n' "${expected[@]}" | sort) <(printf '%s\n' "$list" | sort); then
            echo "::error::package surface differs from the approved closed-by-default inventory"
            echo "---- package --list ----"
            printf '%s\n' "$list"
            exit 1
          fi
          echo "Package include/exclude checks passed."

  reuse:
    name: REUSE lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      # Pinned to full commit SHA (v5.0.0).
      - name: REUSE compliance check
        uses: fsfe/reuse-action@bb774aa972c2a89ff34781233d275075cbddf542
