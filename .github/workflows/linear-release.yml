# Linear Release — scheduled pipeline (named versions already exist in Linear).
#
# Kept out of ci.yml: that workflow is the Rust MSRV / build / test / package
# gate. This job only talks to Linear Releases and must fetch full git history
# (`fetch-depth: 0`).
#
# Pipeline: https://linear.app/rpd-34/pipeline/limbic-critic/releases
# Action:   linear/linear-release-action@v0  (issue #56 / RM-1176)
#
# GitHub remains source of truth for issue state. Commits and PR titles
# should keep carrying Linear identifiers (RM-xxxx) so scanning can attach
# issues; no extra `issue_pattern` is configured.
#
# Requires repo or org secret LINEAR_ACCESS_KEY (same Linear pipeline access
# key used on synaptic-mesh). Do not invent a value here. Limen-Neural already
# has LINEAR_ACCESS_KEY as an organization Actions secret.

name: Linear Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Scan commits without mutating Linear releases
        type: boolean
        default: true
      version:
        description: Linear release version (defaults to 0.3.0)
        required: false
        type: string
        default: "0.3.0"

# Serialize main-push sync and tag complete against the same Linear release.
# Do not cancel in-progress: a tag complete must not interleave with a push sync.
# queue: max (up to 100 pending) so a later main push cannot replace a pending
# tag complete (default queue is a single pending run).
concurrency:
  group: linear-release-${{ github.repository }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  linear-release:
    name: Sync Linear release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Same immutable SHA as ci.yml / coverage.yml (v7.0.0). fetch-depth: 0
      # is required so the Linear action can scan full commit history.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      # Push to main: hardcoded 0.3.0 (Linear In Progress), same active-train
      # pattern as synaptic-mesh. After 0.3.0 is completed, bump this default
      # (and workflow_dispatch default) when the next Linear release opens. Do
      # not invent dynamic version discovery.
      # Tag: vMAJOR.MINOR.PATCH only (v0.3.0 → 0.3.0); anything else is empty
      # and skips sync and complete. workflow_dispatch: version input, default 0.3.0.
      - name: Resolve Linear release version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DISPATCH_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
        run: |
          set -euo pipefail
          version=""
          # Tag refs always win, including workflow_dispatch targeting a tag, so
          # a mismatched dispatch version cannot complete the wrong Linear release.
          if [ "$REF_TYPE" = "tag" ]; then
            if [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              version="${REF_NAME#v}"
            else
              echo "Ignoring tag ${REF_NAME}: Linear release tags must be vMAJOR.MINOR.PATCH"
            fi
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            version="${DISPATCH_VERSION#"${DISPATCH_VERSION%%[![:space:]]*}"}"
            version="${version%"${version##*[![:space:]]}"}"
            if [ -z "$version" ]; then
              echo "Ignoring empty workflow_dispatch version"
            fi
          else
            version="0.3.0"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # dry_run only on workflow_dispatch when requested (default true there).
      # Main pushes and tag pushes always mutate. Same expression on complete so
      # a tag-ref dispatch with dry_run cannot mark a Linear release released.
      - name: Sync issues into Linear release
        if: steps.version.outputs.version != ''
        uses: linear/linear-release-action@53ad0f863963e7f8e270fba18426bbb55ef55384 # v0
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
          command: sync
          version: ${{ steps.version.outputs.version }}
          dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

      - name: Complete Linear release for tagged version
        if: github.ref_type == 'tag' && steps.version.outputs.version != ''
        uses: linear/linear-release-action@53ad0f863963e7f8e270fba18426bbb55ef55384 # v0
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
          command: complete
          version: ${{ steps.version.outputs.version }}
          dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
