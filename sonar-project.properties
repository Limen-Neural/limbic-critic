# SonarQube Cloud project configuration.
# The analysis token is supplied by the SONAR_TOKEN secret in
# .github/workflows/sonarqube.yml, never here.

sonar.projectKey=Limen-Neural_limbic-critic
sonar.organization=limen-neural

# Analyze the library and its example only; build output and vendored
# tooling state are not source.
sonar.sources=src,examples
sonar.sourceEncoding=UTF-8
sonar.exclusions=target/**,docs/logo.png
