[package]
name = "limbic-critic"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Neuromodulatory reward shaping and RL critic functions for SNNs."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Limen-Neural/limbic-critic"

[lib]
name = "limbic_critic"
path = "src/lib.rs"

[dependencies]

[[example]]
name = "generic_environment"
path = "examples/generic_environment.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
