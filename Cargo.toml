[package]
name = "limbic-critic"
version = "0.3.0"
edition = "2024"
# MSRV promised to users (edition 2024 floor). Independent of the dev
# toolchain in rust-toolchain.toml; CI's `msrv` job builds and tests on this
# value, and README.md / CONTRIBUTING.md must state the same one.
rust-version = "1.85"
description = "Reward-shaping / modulator-mapping primitive for SNNs (not a full actor-critic)."
license = "MIT OR Apache-2.0"
authors = ["Raul Cardenas Montoya <montoyaraul34@gmail.com>"]
repository = "https://github.com/Limen-Neural/limbic-critic"
homepage = "https://github.com/Limen-Neural/limbic-critic"
documentation = "https://docs.rs/limbic-critic"
readme = "README.md"
keywords = ["snn", "neuromodulators", "reward-shaping", "reward"]
categories = ["science", "simulation"]
# crates.io surface (closed-by-default, GH#72): only the intended public
# library artifact ships. Unknown future local/agent/tool directories are
# excluded by construction. CONTRIBUTING.md, CLAUDE.md, CI, editor state,
# and the unused docs logo stay repo-only.
# NOTE: bare filenames match at any depth (gitignore semantics), so every
# entry is root-anchored with a leading `/`. Without the anchor, e.g.
# `README.md` would also match `.opencode/skills/.../README.md`.
include = [
    "/src/**",
    "/examples/**",
    "/LICENSE-MIT",
    "/LICENSE-APACHE-2.0",
    "/LICENSES/**",
    "/README.md",
    "/CHANGELOG.md",
    "/REUSE.toml",
    "/docs/ARCHITECTURE.md",
    "/docs/BOUNDARY_MATRIX.md",
    "/Cargo.toml",
]

[lib]
name = "limbic_critic"
path = "src/lib.rs"

# no_std surface (RM-2068 / GH#89). `std` (default) keeps the published
# build's behavior identical, including `f32::tanh` from the system math
# library. `libm` supplies `tanhf` for builds without `std` — `f32::tanh`
# is not in `core` at the 1.85 MSRV. Enabling neither is a guided compile
# error at the crate root; CI's `no_std` job builds thumbv7em-none-eabihf
# with `libm` and lints/tests that configuration.
[features]
default = ["std"]
std = []
libm = ["dep:libm"]

[dependencies]
# Optional `tanh` provider for no_std targets only; never compiled for
# default (`std`) users, so the required-dependency footprint stays zero.
libm = { version = "0.2", optional = true }

[[example]]
name = "generic_environment"
path = "examples/generic_environment.rs"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
